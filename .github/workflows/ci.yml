name: CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-test-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Linting and Fixing (Ruff)
        run: |
          ruff check . --exclude "*.ipynb" --exclude "notebooks/" --fix

      - name: Commit and push changes if any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix ruff formatting errors"
          branch: ${{ github.head_ref || github.ref_name }}

      - name: Type Checking (Mypy)
        run: |
          mypy . --exclude "notebooks/"

      - name: Tests and Coverage (Pytest)
        run: |
          pytest --ignore=notebooks/ --cov=. --cov-report=term-missing
