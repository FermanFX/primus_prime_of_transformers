[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic-fbp"
version = "1.0.0"
description = "Seismic First Break Picking with U-Net"
authors = [{name = "Your Name", email = "you@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "numpy>=1.24.0",
    "h5py>=3.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.7.0",
    "mlflow>=2.3.0",
    "tensorboard>=2.12.0",
    "loguru>=0.7.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.2.0",
]

[tool.ruff]
# Exclude Jupyter Notebooks and notebook directories from linting
exclude = [
    "*.ipynb",
    "notebooks",
    "notebook",
]

[tool.mypy]
# Exclude notebook directories from type checking
exclude = [
    'notebooks/',
    'notebook/',
]
python_version = "3.13"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "h5py.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torchvision.models"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Default execution arguments
addopts = "--cov=. --cov-report=term-missing"
# Exclude notebook directories from test discovery
norecursedirs = [
    "notebooks",
    "notebook",
]
markers = [
    "slow: marks tests as slow-running",
]
